name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SQLite Dev Library (untuk Unit Test Drift Native)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable Terbaru
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Lengkapi Wrapper & Ikon Bawaan Android (Tanpa Menimpa Kode Kustom)
        run: flutter create --platforms=android --org com.example .

      - name: Install Dependencies Dart/Flutter
        run: flutter pub get

      - name: Generate Kode Database Drift (.g.dart)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analisis Kode Statis
        run: flutter analyze --no-fatal-infos

      - name: Jalankan Seluruh Unit & End-to-End Tests
        run: flutter test

      - name: Build APK Ringan Khusus ARM64 (POCO / Android Modern)
        run: flutter build apk --release --split-per-abi --tree-shake-icons

      - name: Upload Artifact APK ARM64 (Siap Install di POCO)
        uses: actions/upload-artifact@v4
        with:
          name: english-fokus-arm64-v8a-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload Semua Varian APK
        uses: actions/upload-artifact@v4
        with:
          name: english-fokus-all-abi-apks
          path: build/app/outputs/flutter-apk/*.apk
